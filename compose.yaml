services:
  backend:
    build:
      context: ./server
    env_file:
      - ./server/.env
    environment:
      PORT: "5000"
      CLIENT_URL: "http://localhost:8081"
    ports:
      - "5000:5000"
    restart: unless-stopped

  frontend:
    build:
      context: ./client
      args:
        VITE_API_URL: "http://localhost:5000"
    ports:
      - "8081:80"
    depends_on:
      - backend
    restart: unless-stopped
