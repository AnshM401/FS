name: Experiment 8 CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Validate frontend, backend and Docker images
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            client/package-lock.json
            server/package-lock.json

      - name: Install backend dependencies
        run: npm ci --prefix server

      - name: Check backend syntax
        run: find server -path '*/node_modules' -prune -o -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Install frontend dependencies
        run: npm ci --prefix client

      - name: Build React frontend
        run: npm run build --prefix client

      - name: Build backend Docker image
        run: docker build -t library-backend:ci ./server

      - name: Build frontend Docker image
        run: docker build -t library-frontend:ci ./client
